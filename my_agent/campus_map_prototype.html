<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Compass — De Anza College (Live Data)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17212B;
    --paper:#F5F1E8;
    --paper-2:#EDE7D8;
    --coral:#E85A4F;
    --amber:#D9922F;
    --slate:#5C7A93;
    --text:#22282E;
    --text-dim:#6B6459;
    --hair:#D8D2C4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  header{
    background:var(--ink);
    color:var(--paper);
    padding:14px 20px 0 20px;
    flex-shrink:0;
    position:relative;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.3px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .dot{color:var(--coral);}
  .brand small{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:11px;
    color:#8B93A0;
    letter-spacing:1px;
  }

  .profile-controls{display:flex;align-items:center;gap:8px;}
  .profile-banner{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#AEB6C0;
    background:#1E2A38;
    border:1px solid #2E3D4E;
    border-radius:20px;
    padding:6px 14px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .profile-banner strong{color:var(--paper);font-weight:600;}
  .edit-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:transparent;
    color:#AEB6C0;
    border:1px solid #2E3D4E;
    border-radius:20px;
    padding:6px 12px;
    cursor:pointer;
  }
  .edit-btn:hover{color:var(--paper);border-color:#465A70;}

  #editProfileBtn{
    background:#F4A62A;
    color:#17212B;
    border:1px solid #F4A62A;
    font-weight:700;
  }

  #editProfileBtn:hover{
    background:#FFB83E;
    border-color:#FFB83E;
    color:#17212B;
  }
  .profile-panel{
    position:absolute;
    top:56px;
    right:20px;
    z-index:1000;
    width:300px;
    background:#1E2A38;
    border:1px solid #2E3D4E;
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .profile-panel.hidden{display:none;}
  .profile-panel-row{margin-bottom:10px;}
  .profile-panel-row label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    color:#8B93A0;
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .profile-panel-row select,
  .profile-panel-row input[type="text"],
  .profile-panel-row input[type="email"],
  .profile-panel-row input[type="password"]{
    width:100%;
    background:#101923;
    border:1px solid #2E3D4E;
    color:var(--paper);
    border-radius:6px;
    padding:7px 9px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
  }
  .email-notification-box{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #2E3D4E;
}

.email-actions{
    display:flex;
    gap:6px;
    margin-top:7px;
}

.email-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
}

.email-subscribe-btn{
    background:transparent;
    color:#AEB6C0;
    border:1px solid #2E3D4E;
}

.email-subscribe-btn:hover{
    color:white;
    border-color:#465A70;
}

.email-subscribe-btn.active{
    background:var(--coral);
    color:white;
    border-color:var(--coral);
}
.email-unsubscribe-btn{
    background:transparent;
    color:#AEB6C0;
    border:1px solid #2E3D4E;
}

#emailStatus{
    display:block;
    margin-top:6px;
    font-size:10.5px;
    color:#8B93A0;
    line-height:1.4;
}
  /* Interests chip picker (career/academic/transfer/etc.) was removed
     2026-09-03: it had no structured backend grounding the way major and
     year do -- it was just raw text handed to the agent with a single
     vague "consider it" instruction (priority_agent.py rule 7), and most
     of the 9 tags either duplicated GENERAL_EVENT_CATEGORIES (already
     applied to every student regardless of selection) or matched no real
     De Anza category at all. Worth reconsidering once scraping covers
     enough categories/events to build a real per-tag mapping the way
     MAJOR_EVENT_CATEGORIES does for majors (see event_category_map.py) --
     until then it was UI complexity for close to zero effect on results. */

  /* Read-only note showing which De Anza categories are already being
     weighted higher because of the student's major -- not a picker, since
     that grounding is computed server-side from major alone (see
     renderCategoryInfo()). */
  .category-info-row{
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed #2E3D4E;
  }
  .category-info{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    line-height:1.6;
    color:#8B93A0;
  }
  .category-info strong{color:#AEB6C0;font-weight:600;}
  .profile-panel-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
  }
  #profileStatus{font-size:10.5px;color:#8B93A0;flex:1;}
  #applyProfileBtn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    background:var(--coral);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  #applyProfileBtn:disabled{opacity:0.6;cursor:default;}
  .forget-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    background:transparent;
    color:#8B93A0;
    border:1px solid #2E3D4E;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    flex-shrink:0;
  }
  .forget-btn:hover{color:var(--paper);border-color:#465A70;}

  .ticker-wrap{
    background:#0F161E;
    border-top:1px solid #2A3644;
    border-bottom:1px solid #2A3644;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:34px;
    display:flex;
    align-items:center;
  }
  .ticker-label{
    background:var(--coral);
    color:white;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    padding:4px 10px;
    height:100%;
    display:flex;
    align-items:center;
    flex-shrink:0;
    z-index:2;
  }
  .ticker-track{
    display:inline-flex;
    align-items:center;
    animation:scroll 26s linear infinite;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#D9DEE4;
    padding-left:16px;
  }
  .ticker-track span.sep{color:#4B5A6B;margin:0 18px;}
  .ticker-track span.tag-high{color:var(--coral);font-weight:600;}
  .ticker-track span.tag-med{color:var(--amber);font-weight:600;}
  @keyframes scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  main{
    flex:1;
    display:flex;
    min-height:0;
    background:var(--paper);
  }
  #map{flex:1;min-width:0;}

  .pin{
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
    border:2px solid white;
  }
  .pin-inner{transform:rotate(45deg);font-size:13px;}
  .pin.high{background:var(--coral);width:38px;height:38px;}
  .pin.medium{background:var(--amber);width:30px;height:30px;}
  .pin.low{background:var(--slate);width:24px;height:24px;}
  .pin.high .pin-inner{font-size:16px;}
  .pin.medium .pin-inner{font-size:13px;}
  .pin.low .pin-inner{font-size:11px;}

  .leaflet-popup-content-wrapper{border-radius:10px;font-family:'Inter',sans-serif;}
  .popup-tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.5px;
    padding:2px 8px;
    border-radius:10px;
    color:white;
    margin-bottom:6px;
  }
  .popup-title{font-weight:600;font-size:14.5px;margin:2px 0 4px;}
  .popup-reason{font-size:12px;color:var(--text-dim);line-height:1.5;font-style:italic;}

  aside{
    width:340px;
    flex-shrink:0;
    background:var(--paper);
    border-left:1px solid var(--hair);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .agenda-head{padding:16px 18px 10px;border-bottom:1px solid var(--hair);}
  .agenda-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  .agenda-head p{margin:0;font-size:12px;color:var(--text-dim);}
  .range-filter{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .range-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--hair);
    border-radius:12px;
    padding:3px 9px;
    cursor:pointer;
  }
  .range-btn.active{background:var(--coral);color:white;border-color:var(--coral);}
  .agenda-list{flex:1;overflow-y:auto;padding:8px 12px;}
  .card{
    background:white;
    border:1px solid var(--hair);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    border-left-width:4px;
    border-left-style:solid;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,33,43,0.08);}
  .card.high{border-left-color:var(--coral);}
  .card.medium{border-left-color:var(--amber);}
  .card.low{border-left-color:var(--slate);}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;}
  .card-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.5px;
    flex-shrink:0;
  }
  .card.high .card-tag{color:var(--coral);}
  .card.medium .card-tag{color:var(--amber);}
  .card.low .card-tag{color:var(--slate);}
  .card-when{font-size:11px;color:var(--text-dim);text-align:right;}
  .card-title{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .card-loc{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .card-reason{font-size:12px;color:var(--text);line-height:1.4;font-style:italic;}
  .virtual-pill{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.3px;
    background:var(--paper-2);
    color:var(--text-dim);
    border-radius:8px;
    padding:1px 7px;
    margin-left:5px;
  }

  .legend{
    padding:12px 18px;
    border-top:1px solid var(--hair);
    font-size:11px;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .legend-row{display:flex;align-items:center;gap:8px;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  @media (max-width:820px){
    main{flex-direction:column;}
    aside{width:100%;border-left:none;border-top:1px solid var(--hair);max-height:46vh;}
    #map{height:34vh;}
    .header-top{flex-direction:column;align-items:flex-start;}
    .profile-panel{right:12px;left:12px;width:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">Campus<span class="dot">·</span>Compass <small>DE ANZA COLLEGE — LIVE SCRAPED DATA</small></div>
    <div class="profile-controls">
      <div class="profile-banner" id="profileBanner"></div>

      
      <button class="edit-btn" id="signupBtn" type="button">
        Sign up
      </button>

      <button class="edit-btn" id="loginBtn" type="button">
        Log in
      </button>

      <span id="loggedInUser" style="display:none;"></span>

      <button
        class="edit-btn"
        id="logoutBtn"
        type="button"
        style="display:none;"
      >
        Log out
      </button>

      <button class="edit-btn" id="editProfileBtn" type="button">
        Edit profile
      </button>
    </div>
  </div>
  <div class="ticker-wrap">
    <div class="ticker-label">PRIORITY FEED</div>
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
  
  <div class="profile-panel hidden" id="authPanel">
    <div class="profile-panel-row">
      <label>Email</label>
      <input
        type="email"
        id="authEmail"
        placeholder="your@email.com"
        autocomplete="email"
      >
    </div>

    <div class="profile-panel-row">
      <label>Password</label>
      <input
        type="password"
        id="authPassword"
        placeholder="At least 8 characters"
        autocomplete="current-password"
      >
    </div>

    <div class="profile-panel-actions">
      <span id="authStatus"></span>

      <button class="forget-btn" id="authCancelBtn" type="button">
        Cancel
      </button>

      <button id="authSubmitBtn" type="button">
        Continue
      </button>
    </div>
  </div>

  <div class="profile-panel hidden" id="profilePanel">
    <div class="profile-panel-row">
      <label>Year</label>
      <select id="inputYear">
        <option value="freshman">Freshman</option>
        <option value="general">General student</option>
      </select>
    </div>
    <div class="profile-panel-row">
      <label>Major / Intended Major</label>
      <input
        type="text"
        id="inputMajor"
        list="majorOptions"
        placeholder="Search your major..."
        autocomplete="off"
      >

      <datalist id="majorOptions">
        <option value="Accounting">
        <option value="Administration of Justice">
        <option value="Anthropology">
        <option value="Art">
        <option value="Art History">
        <option value="Biology">
        <option value="Business Administration">
        <option value="Chemistry">
        <option value="Child Development">
        <option value="Cognitive Science">
        <option value="Communication Studies">
        <option value="Computer Science">
        <option value="Cybersecurity">
        <option value="Data Science">
        <option value="Economics">
        <option value="Engineering">
        <option value="English">
        <option value="Environmental Science">
        <option value="Film / Television">
        <option value="Geography">
        <option value="Geology">
        <option value="Global Studies">
        <option value="Graphic Design">
        <option value="Health Sciences">
        <option value="History">
        <option value="Humanities">
        <option value="Journalism">
        <option value="Kinesiology">
        <option value="Linguistics">
        <option value="Mathematics">
        <option value="Music">
        <option value="Nursing">
        <option value="Paralegal Studies">
        <option value="Philosophy">
        <option value="Photography">
        <option value="Physics">
        <option value="Political Science">
        <option value="Psychology">
        <option value="Public Health">
        <option value="Sociology">
        <option value="Studio Art">
        <option value="Undeclared / Undecided">
      </datalist>
    </div>
    <div class="profile-panel-row">
      <label>Personalization notes</label>

      <div class="category-info-row" id="categoryInfoRow" style="display:none;">
        <p class="category-info" id="categoryInfoText"></p>
      </div>

      <div class="category-info-row" id="yearInfoRow" style="display:none;">
        <p class="category-info" id="yearInfoText"></p>
      </div>
    </div>

    <div class="profile-panel-row email-notification-box">
      <label>Daily Event Email</label>

      <input
        type="email"
        id="inputEmail"
        placeholder="your@email.com"
        autocomplete="email"
      >

      <div class="email-actions">
        <button
          class="email-btn email-subscribe-btn"
          id="subscribeEmailBtn"
          type="button"
        >
          Get daily events
        </button>

        <button
          class="email-btn email-unsubscribe-btn"
          id="unsubscribeEmailBtn"
          type="button"
        >
          Turn off
        </button>
      </div>

      <span id="emailStatus"></span>
    </div>
    <div class="profile-panel-actions">
      <span id="profileStatus"></span>
      <button class="forget-btn" id="forgetProfileBtn" type="button" title="Forget the profile saved on this browser">Forget</button>
      <button id="applyProfileBtn" type="button">Update priorities</button>
    </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div class="agenda-head">
      <h2 id="agendaTitle">Your Priorities</h2>
      <p id="agendaSub">Ranked by the Strands Agent, not a fixed formula</p>
      <div class="range-filter" id="rangeFilter">
        <button type="button" class="range-btn" data-range="1">Today</button>
        <button type="button" class="range-btn" data-range="7">1 week</button>
        <button type="button" class="range-btn" data-range="14">2 weeks</button>
        <button type="button" class="range-btn active" data-range="30">1 month</button>
        <button type="button" class="range-btn" data-range="all">All</button>
      </div>
    </div>
    <div class="agenda-list" id="agendaList"></div>
    <div class="legend">
      <div class="legend-row"><span class="legend-dot" style="background:var(--coral)"></span> High — AI-judged urgent and relevant</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--amber)"></span> Medium — relevant, not urgent</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--slate)"></span> Low — lower relevance for this profile</div>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------------------------------------------------
   Data starts out as a static snapshot generated by the real
   pipeline (scrape_events.py -> geocode_events.py ->
   priority_agent.py, see pipeline.py) so this page still works
   standalone with zero setup.

   Clicking "Edit profile" and "Update priorities" calls the
   Flask backend in app.py (POST /api/rerank), which re-runs the
   Strands Agent's judgment against events now persisted in
   events.db (see db.py) for a NEW profile -- live, no re-running
   pipeline.py by hand. If the backend isn't running, the page
   still works with the static snapshot below; you just can't
   change the profile live. See PROJECT_LOG.md section 11.

   No login: the student's profile is saved to this browser's
   localStorage (see STORAGE_KEY below), and re-applied
   automatically next time they open the page. Setting your
   categories once is the whole "account" -- see the project's
   progress notes for why (Login is intentionally lower priority
   than making the map fully usable without one).
--------------------------------------------------------- */
const BACKEND_URL = "http://localhost:5001";
const STORAGE_KEY = "campusCompassProfile";
const EMAIL_STORAGE_KEY = "campusCompassEmail";
// interests chip picker removed 2026-09-03 -- see the CSS comment above
// .category-info-row for why. STUDENT_PROFILE.interests stays [] for now
// (still sent to the backend, which handles an empty list fine); revisit
// once there's a real per-tag category mapping worth building.

let GENERATED_AT = "2026-08-23T18:53:16.523889";
let STUDENT_PROFILE = {
  year: "general",
  major: "",
  interests: []
};
// True until real backend data (from /api/rerank) replaces EVENTS below.
// EVENTS starts out as a snapshot generated on 2026-08-23 with real but
// fixed dates -- once those dates are all in the past, showing them as if
// they were current is actively misleading rather than a harmless demo
// fallback. renderData() only applies the "hide past events" / "snapshot
// expired" handling while this stays true; once live data arrives it's
// always current, so the flag flips off and events render unfiltered.
let STATIC_SNAPSHOT = true;
const CAMPUS_CENTER = [37.3192806, -122.0447919];

// Plain day counts from today, inclusive of today. "all" has no upper
// bound -- it's just "everything scrape_events.py collected" (currently
// up to months_ahead=3 worth of events; see scrape_events.py).
const RANGE_DAYS = { "1": 1, "7": 7, "14": 14, "30": 30, "all": Infinity };
let SELECTED_RANGE = "30";

let EVENTS = [
  {"title":"University of California (UC) Application Workshop","date":"2026-08-25","time":"2:30 pm to 4:00 pm","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376791","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"high","reason":"UC application workshop is in 2 days, relevant for sophomore transfer planning."},
  {"title":"Transfer Admission Planner (TAP) Workshop","date":"2026-08-27","time":"9:30 am to 11:00 am","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376783","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"high","reason":"TAP workshop in 4 days, directly useful for sophomore transfer preparation."},

const TIER_RANK = { high: 0, medium: 1, low: 2 };

let map;
let leafletMarkers = [];

function formatDate(iso){
  if(!iso) return "No date";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });
}

function locationLabel(ev){
  if (ev.is_virtual) return "Online";
  if (!ev.location) return "No location listed";
  const prefix = (ev.match_type === "approximate" || ev.match_type === "fallback_campus_center") ? "~ " : "";
  return prefix + ev.location;
}

function makeIcon(tier, count = 1){
    const sizes = { high: 38, medium: 30, low: 24 };
    const size = sizes[tier] || 24;

    const inside = count > 1 ? count : "●";

    return L.divIcon({
        className: "",
        html: `<div class="pin ${tier}"><div class="pin-inner">${inside}</div></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size]
    });
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function renderProfileBanner(){
  const el = document.getElementById("profileBanner");

  if (!STUDENT_PROFILE.major) {
    el.innerHTML = `<strong>General Campus Events</strong> · choose a major to personalize`;
    return;
  }

  const interestList = STUDENT_PROFILE.interests.length
    ? STUDENT_PROFILE.interests.join(", ")
    : "no interests set";

  const generatedDate = new Date(GENERATED_AT).toLocaleDateString(
    "en-US",
    { month: "short", day: "numeric" }
  );

  el.innerHTML =
    `Personalized for <strong>${capitalize(STUDENT_PROFILE.year)} · ${STUDENT_PROFILE.major}</strong> ` +
    `(${interestList}) · generated ${generatedDate}`;
}

/* Shown the instant we know there's a saved profile to restore, since the
   real /api/rerank call behind tryAutoPersonalize() can take several
   seconds (real Bedrock/Strands Agent latency, not a bug) -- without this
   the page just sits on the static snapshot and looks stuck/reverted. */
function showPersonalizingBanner(){

}

function initMap(){
  map = L.map("map", { zoomControl: false }).setView(CAMPUS_CENTER, 16);
  L.control.zoom({ position: "bottomright" }).addTo(map);

  }).addTo(map);

// ISO yyyy-mm-dd strings compare correctly with plain string comparison.
function isPastEvent(ev, todayIso){
  return !!ev.date && ev.date < todayIso;
}

// Same "don't hide what we can't verify" rule as isPastEvent(): an event
// with no date at all always passes, regardless of which range is active.
function isWithinSelectedRange(ev, todayIso, rangeDays){
  if (!ev.date) return true;
  if (ev.date < todayIso) return false; // never show past events, even on "all"
  if (rangeDays === Infinity) return true;
  const end = new Date(todayIso + "T00:00:00");
  end.setDate(end.getDate() + rangeDays - 1);
  const endIso = end.toISOString().slice(0, 10);
  return ev.date <= endIso;
}

function initRangeFilter(){
  document.querySelectorAll("#rangeFilter .range-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("#rangeFilter .range-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      SELECTED_RANGE = btn.dataset.range;
      renderData();
    };
  });
}

function renderData(){
  renderProfileBanner();

  // clear any markers from a previous render (live re-rank replaces the pins)
  leafletMarkers.forEach(({ marker }) => map.removeLayer(marker));
  leafletMarkers = [];

  // EVENTS starts out as a fixed offline snapshot (generated 2026-08-23).
  // Once every one of those dates is in the past, that's no longer a
  // harmless demo fallback -- it's a map full of events that already
  // happened. Only filter/guard while STATIC_SNAPSHOT is true; once live
  // data replaces EVENTS (see tryAutoPersonalize / applyProfileBtn), it's
  // always current and renders unfiltered.
  const todayIso = new Date().toISOString().slice(0, 10);
  const source = STATIC_SNAPSHOT ? EVENTS.filter(ev => !isPastEvent(ev, todayIso)) : EVENTS;

  if (STATIC_SNAPSHOT && source.length === 0) {
    renderStaleSnapshotNotice();
    return;
  }

  // Narrow further to whichever range the student picked in the agenda
  // header (Today / 1 week / 2 weeks / 1 month). This is
  // separate from the STATIC_SNAPSHOT past-event guard above: that one
  // detects "the whole demo snapshot is stale", this one is just "the
  // student asked to see a shorter window."
  const rangeFiltered = source.filter(ev => isWithinSelectedRange(ev, todayIso, RANGE_DAYS[SELECTED_RANGE]));

  if (rangeFiltered.length === 0) {
    document.getElementById("agendaList").innerHTML =
      `<div style="padding:16px;color:var(--text-dim);font-size:12.5px;line-height:1.6;">No events in this range. Try a wider one above.</div>`;
    document.getElementById("agendaSub").textContent = `0 events in this range, out of ${source.length} scraped`;
    document.getElementById("tickerTrack").innerHTML =
      `<span>No events in this range — try a wider one</span>`;
    return;
  }

  const sorted = [...rangeFiltered].sort((a, b) => {
    const rankDiff = TIER_RANK[a.tier] - TIER_RANK[b.tier];
    if (rankDiff !== 0) return rankDiff;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  // Group events that share the same map location
const locationGroups = new Map();

sorted.forEach(ev => {
    if (ev.latitude == null || ev.longitude == null) return;

    // Round coordinates so events at the same place are grouped together
    const key =
        `${Number(ev.latitude).toFixed(6)},${Number(ev.longitude).toFixed(6)}`;

    if (!locationGroups.has(key)) {
        locationGroups.set(key, []);
    }

    locationGroups.get(key).push(ev);
});

locationGroups.forEach(events => {

    // Highest-priority event determines the pin color
    const representative = events.reduce((best, ev) => {
        return TIER_RANK[ev.tier] < TIER_RANK[best.tier]
            ? ev
            : best;
    }, events[0]);

    const marker = L.marker(
        [representative.latitude, representative.longitude],
        {
            icon: makeIcon(representative.tier, events.length)
        }
    ).addTo(map);


    // Put every event at this location into the same popup
    const popupContent = events.map((ev, index) => {

        const tierColor =
            ev.tier === "high" ? "#E85A4F" :
            ev.tier === "medium" ? "#D9922F" :
            "#5C7A93";

        const divider =
            index < events.length - 1
                ? `<hr style="
                    border:none;
                    border-top:1px solid #ddd;
                    margin:12px 0;
                ">`
                : "";

        return `
            <div class="popup-event">

                <span
                    class="popup-tag"
                    style="background:${tierColor}"
                >
                    ${formatDate(ev.date)}
                    ${ev.time ? " · " + ev.time : ""}
                    · ${ev.tier.toUpperCase()}
                </span>

                <div class="popup-title">
                    ${ev.title}
                </div>

                <div class="popup-reason">
                    "${ev.reason}"
                </div>

                ${
                    ev.url
                    ? `
                    <a
                        href="${ev.url}"
                        target="_blank"
                        style="
                            display:inline-block;
                            margin-top:6px;
                            font-size:12px;
                            font-weight:600;
                            text-decoration:none;
                        "
                    >
                        View event →
                    </a>
                    `
                    : ""
                }

            </div>

            ${divider}
        `;
    }).join("");


    marker.bindPopup(
        `
        ${
            events.length > 1
            ? `
            <div style="
                font-size:11px;
                font-weight:600;
                margin-bottom:10px;
                opacity:.7;
            ">
                ${events.length} EVENTS AT THIS LOCATION
            </div>
            `
            : ""
        }

        ${popupContent}
        `,
        {
            maxWidth: 330,
            maxHeight: 360
        }
    );


    // Each agenda event points to the shared marker
    events.forEach(ev => {
        leafletMarkers.push({
            ev,
            marker
        });
    });

});

  const agendaList = document.getElementById("agendaList");
  agendaList.innerHTML = "";
  sorted.forEach(ev => {
    const card = document.createElement("div");
    card.className = `card ${ev.tier}`;
    const virtualPill = ev.is_virtual ? `<span class="virtual-pill">VIRTUAL</span>` : "";
    card.innerHTML = `
      <div class="card-top">
        <span class="card-tag">${ev.tier.toUpperCase()}</span>
        <span class="card-when">${formatDate(ev.date)}${ev.time ? " · " + ev.time : ""}</span>
      </div>
      <div class="card-title">${ev.title}${virtualPill}</div>
      <div class="card-loc">📍 ${locationLabel(ev)}</div>
      <div class="card-reason">"${ev.reason}"</div>
    `;
    card.onclick = () => {
      const found = leafletMarkers.find(m => m.ev === ev);
      if (found) {
        map.flyTo([ev.latitude, ev.longitude], 17, { duration: 0.6 });
        found.marker.openPopup();
      } else {
        window.open(ev.url, "_blank");
      }
    };
    agendaList.appendChild(card);
  });

  const highCount = sorted.filter(e => e.tier === "high").length;
  document.getElementById("agendaSub").textContent =
    `${highCount} high-priority item${highCount === 1 ? "" : "s"} out of ${sorted.length} in this range`;

  const tickerSource = sorted.slice(0, 6);
  const tickerItems = tickerSource.map(ev => {
    const cls = ev.tier === "high" ? "tag-high" : ev.tier === "medium" ? "tag-med" : "";
    return `<span class="${cls}">${formatDate(ev.date)} · ${ev.title}</span>`;
  }).join('<span class="sep">//</span>');
  document.getElementById("tickerTrack").innerHTML = tickerItems + '<span class="sep">//</span>' + tickerItems;
}

/* Shown instead of renderData()'s normal output when every event in the
   bundled offline snapshot is in the past and no live backend data has
   arrived yet -- an honest "this demo is expired, here's how to get real
   data" state instead of silently displaying events that already happened. */
function renderStaleSnapshotNotice(){
  const lastDate = EVENTS.reduce((max, ev) => (ev.date && ev.date > max) ? ev.date : max, "");

  const el = document.getElementById("profileBanner");
  el.innerHTML = `<span style="opacity:0.85;">Offline demo snapshot has expired — start the backend for live data</span>`;

  document.getElementById("agendaList").innerHTML = `
    <div style="padding:16px;color:var(--text-dim);font-size:12.5px;line-height:1.6;">
      This page's bundled offline snapshot only covers events through
      <strong>${formatDate(lastDate)}</strong>, which has passed. Run
      <code>python my_agent/app.py</code>, then reload this page, to fetch
      live, currently-ranked events instead of this expired snapshot.
    </div>`;
  document.getElementById("agendaSub").textContent = "Offline snapshot expired — no live backend connected yet";
  document.getElementById("tickerTrack").innerHTML =
    `<span>Offline demo snapshot has expired — start the backend (python my_agent/app.py) for live data</span>`;
}

function loadStoredProfile(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    console.warn("Couldn't read saved profile:", err);
    return null;
  }
}

function saveStoredProfile(profile){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  } catch (err) {
    console.warn("Couldn't save profile locally:", err);
  }
}

function clearStoredProfile(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
}

function updateAuthUI(user){
  const signupBtn = document.getElementById("signupBtn");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loggedInUser = document.getElementById("loggedInUser");
  const emailInput = document.getElementById("inputEmail");

  if (user) {
    signupBtn.style.display = "none";
    loginBtn.style.display = "none";

    loggedInUser.style.display = "inline";
    loggedInUser.textContent = user.email;

    logoutBtn.style.display = "inline-block";

    // Use the logged-in account email automatically
    emailInput.value = user.email;
    emailInput.readOnly = true;

    signupBtn.style.display = "inline-block";
    loginBtn.style.display = "inline-block";

    loggedInUser.style.display = "none";
    loggedInUser.textContent = "";

    logoutBtn.style.display = "none";

    // Logged-out users can type an email manually
    emailInput.readOnly = false;
  }
}

/* ---------------- profile panel wiring ---------------- */

// De Anza category grounding is computed server-side from the student's
// major alone (see app.py's /api/rerank), so this is a read-only note
// rather than a picker: it just explains what's already happening.
function renderCategoryInfo(profile){
  const row = document.getElementById("categoryInfoRow");
  const textEl = document.getElementById("categoryInfoText");
  const relevant = profile && profile.relevant_event_categories;

  if (!relevant || !relevant.length) {
    row.style.display = "none";
    return;
  }

  // Built with DOM calls rather than innerHTML/template strings -- major
  // and the category names ultimately trace back to user-editable fields,
  // so this avoids echoing arbitrary HTML back into the page.
  textEl.textContent = "";
  textEl.append("As a ");
  const majorEl = document.createElement("strong");
  majorEl.textContent = profile.major;
  textEl.append(majorEl, " major, events in ");

  relevant.forEach((category, i) => {
    const catEl = document.createElement("strong");
    catEl.textContent = category;
    textEl.append(catEl);
    if (i < relevant.length - 1) textEl.append(" and ");
  });

  textEl.append(" get an automatic priority boost -- no need to pick these yourself.");
  row.style.display = "";
}

// Same idea as renderCategoryInfo(), for the year-based orientation-event
// weighting from get_year_guidance() (see priority_agent.py rule 11).
function renderYearInfo(profile){
  const row = document.getElementById("yearInfoRow");
  const textEl = document.getElementById("yearInfoText");
  const guidance = profile && profile.year_guidance;

  if (guidance === "boost") {
    textEl.textContent =
      "As a freshman, orientation and welcome events get an automatic priority boost.";
    row.style.display = "";
  } else if (guidance === "reduce") {
    textEl.textContent =
      "Since you're past your first year, orientation and welcome events are weighted lower -- you've likely already been through them.";
    row.style.display = "";
  } else {
    row.style.display = "none";
  }
}

function initProfilePanel(){
  document.getElementById("inputYear").value = STUDENT_PROFILE.year;
  document.getElementById("inputMajor").value = STUDENT_PROFILE.major;

  const storedEmail = loadStoredEmail();

  document.getElementById("inputEmail").value =
    storedEmail;

  if (storedEmail) {
    const subscribeBtn =
      document.getElementById("subscribeEmailBtn");

    subscribeBtn.classList.add("active");
    subscribeBtn.textContent = "Subscribed ✓";
  }

  document.getElementById("editProfileBtn").onclick = () => {
    document.getElementById("profilePanel").classList.toggle("hidden");
  };

  document.getElementById("applyProfileBtn").onclick = async () => {
    const year = document.getElementById("inputYear").value;
    const major = document.getElementById("inputMajor").value.trim();
    const interests = []; // no interest picker anymore -- see note near .category-info-row
    const statusEl = document.getElementById("profileStatus");
    const btn = document.getElementById("applyProfileBtn");

    if (!major) {
      statusEl.textContent = "Major can't be empty.";
      return;
    }

    statusEl.textContent = "Asking the agent to re-rank...";
    btn.disabled = true;
    try {
      const data = await requestRerank({ year, major, interests });
      EVENTS = data.events;
      STUDENT_PROFILE = data.student_profile;
      GENERATED_AT = data.generated_at;
      STATIC_SNAPSHOT = false; // live data now -- always current, no more staleness filtering
      saveStoredProfile(STUDENT_PROFILE);
      renderCategoryInfo(STUDENT_PROFILE);
      renderYearInfo(STUDENT_PROFILE);
      statusEl.textContent = "Updated and saved -- this map will remember it next time you visit.";
      renderData();
      document.getElementById("profilePanel").classList.add("hidden");
    } catch (err) {
      statusEl.textContent = `Backend not reachable (${err.message}). Run "python my_agent/app.py" locally.`;
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  };

  document.getElementById("forgetProfileBtn").onclick = () => {
    clearStoredProfile();
    document.getElementById("profileStatus").textContent = "Forgot saved profile on this browser.";
  };
  document.getElementById("subscribeEmailBtn").onclick = async () => {

    const email =
      document.getElementById("inputEmail").value.trim();

    const year =
      document.getElementById("inputYear").value;

    const major =
      document.getElementById("inputMajor").value.trim();

    const interests = []; // no interest picker anymore -- see note near .category-info-row

    const statusEl =
      document.getElementById("emailStatus");

    if (!email) {
      statusEl.textContent =
        "Enter your email first.";
      return;
    }

    if (!major) {
      statusEl.textContent =
        "Choose your major first.";
      return;
    }

    statusEl.textContent =
      "Saving your email notification settings...";

    try {
      await requestSubscribe(
        email,
        {
          year,
          major,
          interests
        }
      );

      saveStoredEmail(email);

      const subscribeBtn =
        document.getElementById("subscribeEmailBtn");

      subscribeBtn.classList.add("active");
      subscribeBtn.textContent = "Subscribed ✓";

      statusEl.textContent =
        "You'll receive personalized daily event emails.";

    } catch (err) {
      statusEl.textContent =
        `Couldn't subscribe: ${err.message}`;

      console.error(err);
    }
  };


  document.getElementById("unsubscribeEmailBtn").onclick = async () => {

    const email =
      document.getElementById("inputEmail").value.trim();

    const statusEl =
      document.getElementById("emailStatus");

    if (!email) {
      statusEl.textContent =
        "Enter the email you want to unsubscribe.";
      return;
    }

    statusEl.textContent =
      "Turning off notifications...";

    try {
      await requestUnsubscribe(email);

      clearStoredEmail();

      const subscribeBtn =
        document.getElementById("subscribeEmailBtn");

      subscribeBtn.classList.remove("active");
      subscribeBtn.textContent = "Get daily events";

      statusEl.textContent =
        "Daily email notifications are turned off.";

    } catch (err) {
      statusEl.textContent =
        `Couldn't unsubscribe: ${err.message}`;

      console.error(err);
    }
  };
}

let authMode = "signup";

function initAuthPanel(){
  const panel = document.getElementById("authPanel");
  const emailInput = document.getElementById("authEmail");
  const passwordInput = document.getElementById("authPassword");
  const statusEl = document.getElementById("authStatus");
  const submitBtn = document.getElementById("authSubmitBtn");

  document.getElementById("signupBtn").onclick = () => {
    authMode = "signup";
    statusEl.textContent = "";
    submitBtn.textContent = "Sign up";
    panel.classList.remove("hidden");
  };

  document.getElementById("loginBtn").onclick = () => {
    authMode = "login";
    statusEl.textContent = "";
    submitBtn.textContent = "Log in";
    panel.classList.remove("hidden");
  };

  document.getElementById("authCancelBtn").onclick = () => {
    panel.classList.add("hidden");
  };

  document.getElementById("logoutBtn").onclick = async () => {
    try {
      await requestLogout();
      updateAuthUI(null);
    } catch (err) {
      console.error(err);
    }
  };

  submitBtn.onclick = async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      statusEl.textContent = "Enter email and password.";
      return;
    }

    submitBtn.disabled = true;

    try {
      if (authMode === "signup") {
        statusEl.textContent = "Creating account...";

        await requestSignup(email, password);

        statusEl.textContent = "Account created successfully!";
      } else {
        statusEl.textContent = "Logging in...";

        const data = await requestLogin(email, password);

        updateAuthUI(data.user);

        statusEl.textContent = "Logged in successfully!";
      }

      passwordInput.value = "";

    } catch (err) {
      statusEl.textContent = err.message;
      console.error(err);

    } finally {
      submitBtn.disabled = false;
    }
  };
}

async function restoreLoginState(){
  try {
    const data = await requestMe();

    if (data.logged_in) {
      updateAuthUI(data.user);

      STUDENT_PROFILE = {
        year: data.user.year || "general",
        major: data.user.major || "",
        interests: data.user.interests || []
      };

      document.getElementById("inputYear").value =
        STUDENT_PROFILE.year;

      document.getElementById("inputMajor").value =
        STUDENT_PROFILE.major;

      saveStoredProfile(STUDENT_PROFILE);

    } else {
      updateAuthUI(null);
    }
  } catch (err) {
    console.warn("Couldn't restore login state:", err.message);
  }
}

/* On load: if this browser already has a saved profile (no login, just
   localStorage -- see the file-level comment above), apply it
   automatically so the student gets their personalized map without
   touching "Edit profile" again. Silent no-op if the backend isn't
   running yet -- the static snapshot just stays as-is. */
async function tryAutoPersonalize(){
  const stored = loadStoredProfile();
  if (!stored) return;
  showPersonalizingBanner();
  try {
    const data = await requestRerank(stored);
    EVENTS = data.events;
    STUDENT_PROFILE = data.student_profile;
    GENERATED_AT = data.generated_at;
    STATIC_SNAPSHOT = false; // live data now -- always current, no more staleness filtering
    renderData();
    renderCategoryInfo(STUDENT_PROFILE);
    renderYearInfo(STUDENT_PROFILE);
    document.getElementById("inputYear").value = STUDENT_PROFILE.year;
    document.getElementById("inputMajor").value = STUDENT_PROFILE.major;
  } catch (err) {
    console.warn("Auto-personalize skipped (backend not reachable yet):", err.message);
    // Don't leave the banner stuck on "Personalizing..." forever -- fall
    // back to whatever profile/events we actually have (the static
    // snapshot). Re-run renderData() rather than just the banner, so a
    // still-STATIC_SNAPSHOT page correctly falls back to the "expired
    // snapshot" state instead of showing a banner that contradicts an
    // agenda list left over from the very first renderData() call.
    renderData();
  }
}

initMap();
initProfilePanel();
initAuthPanel();
initRangeFilter();
renderData();

// Sequenced rather than fired in parallel: if the student is logged in,
// restoreLoginState() saves their account profile to localStorage first,
// so tryAutoPersonalize() (which reads localStorage) picks up that exact
// profile and does the live /api/rerank call on top of it. Running them
// in parallel would race the two localStorage reads/writes the same way
// the old profile-chip race condition did (see PROJECT_LOG.md Section 13).
(async () => {
  await restoreLoginState();
  await tryAutoPersonalize();
})();
</script>
