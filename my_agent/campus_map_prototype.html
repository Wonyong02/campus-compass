<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Compass — De Anza College (Live Data)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17212B;
    --paper:#F5F1E8;
    --paper-2:#EDE7D8;
    --coral:#E85A4F;
    --amber:#D9922F;
    --slate:#5C7A93;
    --text:#22282E;
    --text-dim:#6B6459;
    --hair:#D8D2C4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  header{
    background:var(--ink);
    color:var(--paper);
    padding:14px 20px 0 20px;
    flex-shrink:0;
    position:relative;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.3px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .dot{color:var(--coral);}
  .brand small{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:11px;
    color:#8B93A0;
    letter-spacing:1px;
  }

  .profile-controls{display:flex;align-items:center;gap:8px;}
  .profile-banner{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#AEB6C0;
    background:#1E2A38;
    border:1px solid #2E3D4E;
    border-radius:20px;
    padding:6px 14px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .profile-banner strong{color:var(--paper);font-weight:600;}
  .edit-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:transparent;
    color:#AEB6C0;
    border:1px solid #2E3D4E;
    border-radius:20px;
    padding:6px 12px;
    cursor:pointer;
  }
  .edit-btn:hover{color:var(--paper);border-color:#465A70;}

  .profile-panel{
    position:absolute;
    top:56px;
    right:20px;
    z-index:1000;
    width:300px;
    background:#1E2A38;
    border:1px solid #2E3D4E;
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .profile-panel.hidden{display:none;}
  .profile-panel-row{margin-bottom:10px;}
  .profile-panel-row label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    color:#8B93A0;
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .profile-panel-row select,
  .profile-panel-row input[type="text"]{
    width:100%;
    background:#101923;
    border:1px solid #2E3D4E;
    color:var(--paper);
    border-radius:6px;
    padding:7px 9px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
  }
  .interest-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    background:#101923;
    color:#AEB6C0;
    border:1px solid #2E3D4E;
    border-radius:14px;
    padding:4px 10px;
    cursor:pointer;
  }
  .chip.active{background:var(--coral);border-color:var(--coral);color:white;}
  .profile-panel-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
  }
  #profileStatus{font-size:10.5px;color:#8B93A0;flex:1;}
  #applyProfileBtn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    background:var(--coral);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  #applyProfileBtn:disabled{opacity:0.6;cursor:default;}
  .forget-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    background:transparent;
    color:#8B93A0;
    border:1px solid #2E3D4E;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    flex-shrink:0;
  }
  .forget-btn:hover{color:var(--paper);border-color:#465A70;}

  .ticker-wrap{
    background:#0F161E;
    border-top:1px solid #2A3644;
    border-bottom:1px solid #2A3644;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:34px;
    display:flex;
    align-items:center;
  }
  .ticker-label{
    background:var(--coral);
    color:white;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    padding:4px 10px;
    height:100%;
    display:flex;
    align-items:center;
    flex-shrink:0;
    z-index:2;
  }
  .ticker-track{
    display:inline-flex;
    align-items:center;
    animation:scroll 26s linear infinite;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#D9DEE4;
    padding-left:16px;
  }
  .ticker-track span.sep{color:#4B5A6B;margin:0 18px;}
  .ticker-track span.tag-high{color:var(--coral);font-weight:600;}
  .ticker-track span.tag-med{color:var(--amber);font-weight:600;}
  @keyframes scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  main{
    flex:1;
    display:flex;
    min-height:0;
    background:var(--paper);
  }
  #map{flex:1;min-width:0;}

  .pin{
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
    border:2px solid white;
  }
  .pin-inner{transform:rotate(45deg);font-size:13px;}
  .pin.high{background:var(--coral);width:38px;height:38px;}
  .pin.medium{background:var(--amber);width:30px;height:30px;}
  .pin.low{background:var(--slate);width:24px;height:24px;}
  .pin.high .pin-inner{font-size:16px;}
  .pin.medium .pin-inner{font-size:13px;}
  .pin.low .pin-inner{font-size:11px;}

  .leaflet-popup-content-wrapper{border-radius:10px;font-family:'Inter',sans-serif;}
  .popup-tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.5px;
    padding:2px 8px;
    border-radius:10px;
    color:white;
    margin-bottom:6px;
  }
  .popup-title{font-weight:600;font-size:14.5px;margin:2px 0 4px;}
  .popup-reason{font-size:12px;color:var(--text-dim);line-height:1.5;font-style:italic;}

  aside{
    width:340px;
    flex-shrink:0;
    background:var(--paper);
    border-left:1px solid var(--hair);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .agenda-head{padding:16px 18px 10px;border-bottom:1px solid var(--hair);}
  .agenda-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  .agenda-head p{margin:0;font-size:12px;color:var(--text-dim);}
  .agenda-list{flex:1;overflow-y:auto;padding:8px 12px;}
  .card{
    background:white;
    border:1px solid var(--hair);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    border-left-width:4px;
    border-left-style:solid;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,33,43,0.08);}
  .card.high{border-left-color:var(--coral);}
  .card.medium{border-left-color:var(--amber);}
  .card.low{border-left-color:var(--slate);}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;}
  .card-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.5px;
    flex-shrink:0;
  }
  .card.high .card-tag{color:var(--coral);}
  .card.medium .card-tag{color:var(--amber);}
  .card.low .card-tag{color:var(--slate);}
  .card-when{font-size:11px;color:var(--text-dim);text-align:right;}
  .card-title{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .card-loc{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .card-reason{font-size:12px;color:var(--text);line-height:1.4;font-style:italic;}
  .virtual-pill{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.3px;
    background:var(--paper-2);
    color:var(--text-dim);
    border-radius:8px;
    padding:1px 7px;
    margin-left:5px;
  }

  .legend{
    padding:12px 18px;
    border-top:1px solid var(--hair);
    font-size:11px;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .legend-row{display:flex;align-items:center;gap:8px;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  @media (max-width:820px){
    main{flex-direction:column;}
    aside{width:100%;border-left:none;border-top:1px solid var(--hair);max-height:46vh;}
    #map{height:34vh;}
    .header-top{flex-direction:column;align-items:flex-start;}
    .profile-panel{right:12px;left:12px;width:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">Campus<span class="dot">·</span>Compass <small>DE ANZA COLLEGE — LIVE SCRAPED DATA</small></div>
    <div class="profile-controls">
      <div class="profile-banner" id="profileBanner"></div>
      <button class="edit-btn" id="editProfileBtn" type="button">Edit profile</button>
    </div>
  </div>
  <div class="ticker-wrap">
    <div class="ticker-label">PRIORITY FEED</div>
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="profile-panel hidden" id="profilePanel">
    <div class="profile-panel-row">
      <label>Year</label>
      <select id="inputYear">
        <option value="freshman">Freshman</option>
        <option value="sophomore">Sophomore</option>
        <option value="junior">Junior</option>
        <option value="senior">Senior</option>
      </select>
    </div>
    <div class="profile-panel-row">
      <label>Major</label>
      <input type="text" id="inputMajor" placeholder="e.g. Computer Science">
    </div>
    <div class="profile-panel-row">
      <label>Interests</label>
      <div class="interest-chips" id="interestChips"></div>
    </div>
    <div class="profile-panel-actions">
      <span id="profileStatus"></span>
      <button class="forget-btn" id="forgetProfileBtn" type="button" title="Forget the profile saved on this browser">Forget</button>
      <button id="applyProfileBtn" type="button">Update priorities</button>
    </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div class="agenda-head">
      <h2 id="agendaTitle">Your Priorities</h2>
      <p id="agendaSub">Ranked by the Strands Agent, not a fixed formula</p>
    </div>
    <div class="agenda-list" id="agendaList"></div>
    <div class="legend">
      <div class="legend-row"><span class="legend-dot" style="background:var(--coral)"></span> High — AI-judged urgent and relevant</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--amber)"></span> Medium — relevant, not urgent</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--slate)"></span> Low — lower relevance for this profile</div>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------------------------------------------------
   Data starts out as a static snapshot generated by the real
   pipeline (scrape_events.py -> geocode_events.py ->
   priority_agent.py, see pipeline.py) so this page still works
   standalone with zero setup.

   Clicking "Edit profile" and "Update priorities" calls the
   Flask backend in app.py (POST /api/rerank), which re-runs the
   Strands Agent's judgment against events now persisted in
   events.db (see db.py) for a NEW profile -- live, no re-running
   pipeline.py by hand. If the backend isn't running, the page
   still works with the static snapshot below; you just can't
   change the profile live. See PROJECT_LOG.md section 11.

   No login: the student's profile is saved to this browser's
   localStorage (see STORAGE_KEY below), and re-applied
   automatically next time they open the page. Setting your
   categories once is the whole "account" -- see the project's
   progress notes for why (Login is intentionally lower priority
   than making the map fully usable without one).
--------------------------------------------------------- */
const BACKEND_URL = "http://localhost:5001";
const STORAGE_KEY = "campusCompassProfile";
let INTEREST_OPTIONS = ["career", "academic", "transfer", "hackathon", "club", "sports", "art", "social", "international"];

let GENERATED_AT = "2026-08-23T18:53:16.523889";
let STUDENT_PROFILE = { year: "sophomore", major: "Computer Science", interests: ["career", "academic"] };
// True only once the student has actually clicked a chip themselves in this
// page load. Keeps renderInterestChips() from "preserving" a stale render
// (e.g. fetchRealCategories()'s fast /api/categories call finishing before
// tryAutoPersonalize()'s slower /api/rerank call restores the real profile).
let userEditedInterests = false;
const CAMPUS_CENTER = [37.3192806, -122.0447919];

let EVENTS = [
  {"title":"University of California (UC) Application Workshop","date":"2026-08-25","time":"2:30 pm to 4:00 pm","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376791","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"high","reason":"UC application workshop is in 2 days, relevant for sophomore transfer planning."},
  {"title":"Transfer Admission Planner (TAP) Workshop","date":"2026-08-27","time":"9:30 am to 11:00 am","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376783","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"high","reason":"TAP workshop in 4 days, directly useful for sophomore transfer preparation."},
  {"title":"Fall classes begin","date":"2026-09-21","time":"All-day event.","location":null,"url":"https://www.deanza.edu/events/event.html?id=188112899","latitude":null,"longitude":null,"is_virtual":false,"match_type":"none","tier":"high","reason":"Fall classes begin soon, academically critical for all students."},
  {"title":"UC Transfer Admission Guarantee (TAG) Workshop","date":"2026-09-03","time":"1:30 pm to 3:00 pm","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376727","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"medium","reason":"UC TAG workshop is relevant for transfer-planning sophomore, about 11 days away."},
  {"title":"University of California (UC) Application Workshop","date":"2026-09-08","time":"9:30 am to 11:00 am","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376793","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"medium","reason":"Another UC application workshop, useful backup opportunity for transfer prep."},
  {"title":"UC Transfer Admission Guarantee (TAG) Workshop","date":"2026-09-09","time":"2:30 pm to 4:00 pm","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376728","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"medium","reason":"UC TAG workshop relevant to sophomore considering UC transfer path."},
  {"title":"UC Transfer Admission Guarantee (TAG) Workshop","date":"2026-09-14","time":"9:30 am to 11:00 am","location":"Online via Zoom","url":"https://www.deanza.edu/events/event.html?id=190376731","latitude":null,"longitude":null,"is_virtual":true,"match_type":"virtual","tier":"medium","reason":"Additional TAG workshop opportunity, useful for transfer-focused sophomore."},
  {"title":"Welcome Day","date":"2026-09-18","time":"10:00 am to 1:00 pm","location":"Main Quad","url":"https://www.deanza.edu/events/event.html?id=189626078","latitude":37.3192,"longitude":-122.0448,"is_virtual":false,"match_type":"approximate","tier":"medium","reason":"Welcome Day could offer academic and career networking opportunities."},
  {"title":"Labor Day holiday - no classes; offices closed","date":"2026-09-07","time":"All-day event.","location":null,"url":"https://www.deanza.edu/events/event.html?id=188112642","latitude":null,"longitude":null,"is_virtual":false,"match_type":"none","tier":"medium","reason":"Labor Day holiday affects class and office availability; good to know."},
  {"title":"College Opening Day","date":"2026-09-17","time":"8:00 am to 5:00 pm","location":"Visual and Performing Arts Center (VPAC)","url":"https://www.deanza.edu/events/event.html?id=189626082","latitude":37.3192806,"longitude":-122.0447919,"is_virtual":false,"match_type":"fallback_campus_center","tier":"low","reason":"College Opening Day has vague details and limited CS relevance."},
  {"title":"District Opening Day","date":"2026-09-16","time":"All-day event.","location":null,"url":"https://www.deanza.edu/events/event.html?id=189626083","latitude":null,"longitude":null,"is_virtual":false,"match_type":"none","tier":"low","reason":"District Opening Day has no details and low direct student relevance."},
  {"title":"Temple University, Japan Campus (Tabling)","date":"2026-09-22","time":"10:00 am to 12:00 pm","location":"Campus Center Dining Hall, table #2","url":"https://www.deanza.edu/events/event.html?id=191118788","latitude":37.320816,"longitude":-122.0455674,"is_virtual":false,"match_type":"confirmed","tier":"low","reason":"Japan campus tabling is loosely relevant; not aligned with CS career interests."},
  {"title":"De Anza Flea Market","date":"2026-09-05","time":"8:00 am to 2:00 pm","location":"Parking Lots A & B","url":"https://www.deanza.edu/events/event.html?id=186205975","latitude":37.3205,"longitude":-122.043,"is_virtual":false,"match_type":"approximate","tier":"low","reason":"Flea market is not related to CS major or academic/career interests."}
];

const TIER_RANK = { high: 0, medium: 1, low: 2 };

let map;
let leafletMarkers = [];

function formatDate(iso){
  if(!iso) return "No date";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });
}

function locationLabel(ev){
  if (ev.is_virtual) return "Online";
  if (!ev.location) return "No location listed";
  const prefix = (ev.match_type === "approximate" || ev.match_type === "fallback_campus_center") ? "~ " : "";
  return prefix + ev.location;
}

function makeIcon(tier){
  const sizes = { high: 38, medium: 30, low: 24 };
  const size = sizes[tier] || 24;
  return L.divIcon({
    className: "",
    html: `<div class="pin ${tier}"><div class="pin-inner">●</div></div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size]
  });
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function renderProfileBanner(){
  const el = document.getElementById("profileBanner");
  const interestList = STUDENT_PROFILE.interests.length ? STUDENT_PROFILE.interests.join(", ") : "no interests set";
  const generatedDate = new Date(GENERATED_AT).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  el.innerHTML = `Personalized for <strong>${capitalize(STUDENT_PROFILE.year)} · ${STUDENT_PROFILE.major}</strong> (${interestList}) · generated ${generatedDate}`;
}

/* Shown the instant we know there's a saved profile to restore, since the
   real /api/rerank call behind tryAutoPersonalize() can take several
   seconds (real Bedrock/Strands Agent latency, not a bug) -- without this
   the page just sits on the static snapshot and looks stuck/reverted. */
function showPersonalizingBanner(){
  const el = document.getElementById("profileBanner");
  el.innerHTML = `<span style="opacity:0.8;">Personalizing your map for your saved profile…</span>`;
}

function initMap(){
  map = L.map("map", { zoomControl: false }).setView(CAMPUS_CENTER, 16);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }).addTo(map);
}

function renderData(){
  renderProfileBanner();

  // clear any markers from a previous render (live re-rank replaces the pins)
  leafletMarkers.forEach(({ marker }) => map.removeLayer(marker));
  leafletMarkers = [];

  const sorted = [...EVENTS].sort((a, b) => {
    const rankDiff = TIER_RANK[a.tier] - TIER_RANK[b.tier];
    if (rankDiff !== 0) return rankDiff;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  sorted.forEach(ev => {
    if (ev.latitude == null || ev.longitude == null) return; // virtual / no-location events get no pin
    const marker = L.marker([ev.latitude, ev.longitude], { icon: makeIcon(ev.tier) }).addTo(map);
    const tierColor = ev.tier === "high" ? "#E85A4F" : ev.tier === "medium" ? "#D9922F" : "#5C7A93";
    marker.bindPopup(`
      <span class="popup-tag" style="background:${tierColor}">${formatDate(ev.date)} · ${ev.tier.toUpperCase()}</span>
      <div class="popup-title">${ev.title}</div>
      <div class="popup-reason">"${ev.reason}"</div>
    `);
    leafletMarkers.push({ ev, marker });
  });

  const agendaList = document.getElementById("agendaList");
  agendaList.innerHTML = "";
  sorted.forEach(ev => {
    const card = document.createElement("div");
    card.className = `card ${ev.tier}`;
    const virtualPill = ev.is_virtual ? `<span class="virtual-pill">VIRTUAL</span>` : "";
    card.innerHTML = `
      <div class="card-top">
        <span class="card-tag">${ev.tier.toUpperCase()}</span>
        <span class="card-when">${formatDate(ev.date)}${ev.time ? " · " + ev.time : ""}</span>
      </div>
      <div class="card-title">${ev.title}${virtualPill}</div>
      <div class="card-loc">📍 ${locationLabel(ev)}</div>
      <div class="card-reason">"${ev.reason}"</div>
    `;
    card.onclick = () => {
      const found = leafletMarkers.find(m => m.ev === ev);
      if (found) {
        map.flyTo([ev.latitude, ev.longitude], 17, { duration: 0.6 });
        found.marker.openPopup();
      } else {
        window.open(ev.url, "_blank");
      }
    };
    agendaList.appendChild(card);
  });

  const highCount = sorted.filter(e => e.tier === "high").length;
  document.getElementById("agendaSub").textContent =
    `${highCount} high-priority item${highCount === 1 ? "" : "s"} out of ${sorted.length} scraped events`;

  const tickerSource = sorted.slice(0, 6);
  const tickerItems = tickerSource.map(ev => {
    const cls = ev.tier === "high" ? "tag-high" : ev.tier === "medium" ? "tag-med" : "";
    return `<span class="${cls}">${formatDate(ev.date)} · ${ev.title}</span>`;
  }).join('<span class="sep">//</span>');
  document.getElementById("tickerTrack").innerHTML = tickerItems + '<span class="sep">//</span>' + tickerItems;
}

/* ---------------- no-login profile persistence (localStorage) ---------------- */

function loadStoredProfile(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    console.warn("Couldn't read saved profile:", err);
    return null;
  }
}

function saveStoredProfile(profile){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  } catch (err) {
    console.warn("Couldn't save profile locally:", err);
  }
}

function clearStoredProfile(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
}

/* ---------------- talking to the backend ---------------- */

async function requestRerank(profile){
  const res = await fetch(`${BACKEND_URL}/api/rerank`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(profile),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Server returned ${res.status}`);
  }
  return res.json();
}

async function fetchRealCategories(){
  try {
    const res = await fetch(`${BACKEND_URL}/api/categories`);
    if (!res.ok) return;
    const data = await res.json();
    const merged = new Set(INTEREST_OPTIONS);
    (data.categories || []).forEach(c => merged.add(c));
    INTEREST_OPTIONS = Array.from(merged);
    renderInterestChips();
  } catch (err) {
    // backend not running yet -- keep the generic fallback list, no big deal
    console.warn("Couldn't load real categories, using generic list:", err.message);
  }
}

/* ---------------- profile panel wiring ---------------- */

function renderInterestChips(){
  const chipsWrap = document.getElementById("interestChips");
  // Only trust the chips currently lit up in the DOM if the student actually
  // clicked one themselves. Otherwise always derive from STUDENT_PROFILE --
  // this is what stops an earlier automatic render (e.g. from
  // fetchRealCategories(), which resolves fast) from "sticking" after
  // tryAutoPersonalize() (slower) later updates STUDENT_PROFILE to the real
  // saved interests.
  const activeSet = userEditedInterests
    ? new Set(Array.from(chipsWrap.querySelectorAll(".chip.active")).map(c => c.textContent))
    : new Set(STUDENT_PROFILE.interests);

  chipsWrap.innerHTML = "";
  INTEREST_OPTIONS.forEach(tag => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip" + (activeSet.has(tag) ? " active" : "");
    chip.textContent = tag;
    chip.onclick = () => {
      userEditedInterests = true;
      chip.classList.toggle("active");
    };
    chipsWrap.appendChild(chip);
  });
}

function initProfilePanel(){
  document.getElementById("inputYear").value = STUDENT_PROFILE.year;
  document.getElementById("inputMajor").value = STUDENT_PROFILE.major;
  renderInterestChips();

  document.getElementById("editProfileBtn").onclick = () => {
    document.getElementById("profilePanel").classList.toggle("hidden");
  };

  document.getElementById("applyProfileBtn").onclick = async () => {
    const year = document.getElementById("inputYear").value;
    const major = document.getElementById("inputMajor").value.trim();
    const interests = Array.from(document.querySelectorAll("#interestChips .chip.active")).map(c => c.textContent);
    const statusEl = document.getElementById("profileStatus");
    const btn = document.getElementById("applyProfileBtn");

    if (!major) {
      statusEl.textContent = "Major can't be empty.";
      return;
    }

    statusEl.textContent = "Asking the agent to re-rank...";
    btn.disabled = true;
    try {
      const data = await requestRerank({ year, major, interests });
      EVENTS = data.events;
      STUDENT_PROFILE = data.student_profile;
      GENERATED_AT = data.generated_at;
      saveStoredProfile(STUDENT_PROFILE);
      // STUDENT_PROFILE.interests now IS what's lit up in the DOM, so it's
      // safe to go back to deriving chip state from the profile again.
      userEditedInterests = false;
      statusEl.textContent = "Updated and saved -- this map will remember it next time you visit.";
      renderData();
      document.getElementById("profilePanel").classList.add("hidden");
    } catch (err) {
      statusEl.textContent = `Backend not reachable (${err.message}). Run "python my_agent/app.py" locally.`;
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  };

  document.getElementById("forgetProfileBtn").onclick = () => {
    clearStoredProfile();
    document.getElementById("profileStatus").textContent = "Forgot saved profile on this browser.";
  };
}

/* On load: if this browser already has a saved profile (no login, just
   localStorage -- see the file-level comment above), apply it
   automatically so the student gets their personalized map without
   touching "Edit profile" again. Silent no-op if the backend isn't
   running yet -- the static snapshot just stays as-is. */
async function tryAutoPersonalize(){
  const stored = loadStoredProfile();
  if (!stored) return;
  showPersonalizingBanner();
  try {
    const data = await requestRerank(stored);
    EVENTS = data.events;
    STUDENT_PROFILE = data.student_profile;
    GENERATED_AT = data.generated_at;
    renderData();
    renderInterestChips();
    document.getElementById("inputYear").value = STUDENT_PROFILE.year;
    document.getElementById("inputMajor").value = STUDENT_PROFILE.major;
  } catch (err) {
    console.warn("Auto-personalize skipped (backend not reachable yet):", err.message);
    // Don't leave the banner stuck on "Personalizing..." forever -- fall
    // back to whatever profile/events we actually have (the static snapshot).
    renderProfileBanner();
  }
}

initMap();
initProfilePanel();
renderData();
fetchRealCategories();
tryAutoPersonalize();
</script>
